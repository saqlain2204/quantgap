name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: also run the slow tests
  workflow_dispatch:

jobs:
  fast:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: CPU-only torch on Linux (much smaller download)
        if: runner.os == 'Linux'
        run: pip install --retries 5 torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install (dev tools, llama.cpp wheel)
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -e ".[dev]"
          # The prebuilt macOS wheel from this index is currently a corrupt zip. Do not let that hide
          # every other result: on macOS the GGUF tests are skipped (Linux and Windows run them).
          pip install --retries 5 --timeout 60 llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || { [ "$RUNNER_OS" = "macOS" ] && echo "::warning::llama-cpp-python wheel failed to install on macOS; GGUF tests skipped"; }
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check src tests site scripts
      - name: Tests (fast)
        run: python -m pytest -m "not slow"

  default-install-has-no-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: quantgap must work without torch
        run: |
          quantgap --help
          quantgap doctor
          python -c "import importlib.util as u; assert u.find_spec('torch') is None, 'torch was installed by default'"

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - run: python -m pytest -m slow
