[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantgap"
dynamic = ["version"]
description = "How much did this quant lose? Measure how far a quantized LLM drifts from the original, without running the original."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Mohammed Saqlain", email = "saqlain2204@gmail.com" }]
keywords = ["llm", "quantization", "gguf", "mlx", "kl-divergence", "llama.cpp", "benchmark", "local-llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The default install MUST NOT pull in torch. Backends are extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pyarrow>=15",
  "huggingface-hub>=0.24",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3"]
mlx = ["mlx-lm>=0.20"]
pack = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.33", "sentencepiece", "protobuf"]
hf = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.33"]
all = ["quantgap[llamacpp,pack]"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "gguf>=0.10", "tokenizers>=0.19", "quantgap[pack]"]

[project.scripts]
quantgap = "quantgap.cli:app"

[project.urls]
Homepage = "https://github.com/saqlain2204/quantgap"
Issues = "https://github.com/saqlain2204/quantgap/issues"
Changelog = "https://github.com/saqlain2204/quantgap/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/quantgap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantgap"]

[tool.hatch.build.targets.sdist]
include = ["src/quantgap", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs a real GGUF or a real model download (run nightly and on release tags)",
]
addopts = "-m 'not slow' -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "site", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
